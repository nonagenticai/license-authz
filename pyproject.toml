[project]
license = "Apache-2.0"
name = "license-authz"
version = "1.0.0"
description = "HTTP ext_authz service for Envoy/Istio license token validation"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.109.1",  # CVE-2024-24762 fixed in 0.109.1
    "starlette>=1.3.1",  # PYSEC-2026-161 (1.0.1); CVE-2026-48817/48818/54282/54283 fixed in 1.3.1
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.26.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.14.2",  # GHSA-4xgf-cpjx-pc3j fixed in 2.14.2
    "redis[hiredis]>=5.2.0",
    "urllib3>=2.8.0",  # CVE-2026-44431, CVE-2026-44432 fixed in 2.7.0
    "werkzeug>=3.1.9",  # CVE-2026-102598 fixed in 3.1.9
    "pyjwt[crypto]>=2.15.1",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
contract = [
    "schemathesis>=3.36.0",
]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
import-not-found = "ignore"

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "ty>=0.0.23",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15",
    "pytest-timeout>=2.4.0",
    "respx>=0.22.0",
]
